<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Клуб лидеров ССК — подбор формата для РОПов</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{
    --violet:#a057ef; --violet2:#7b2fd6; --deep:#5a1ba8;
    --graphite:#373a41; --ink:#2a2b30; --muted:#7c7f8a;
    --gold:#f4b301; --gold2:#ffd75e; --lime:#9bc43c; --sky:#27a4e4;
    --bg:#f6f3fc; --card:#fff; --line:#ece8f5;
    --shadow:0 20px 55px -22px rgba(90,27,168,.4);
    --shadow-sm:0 8px 24px -12px rgba(90,27,168,.3);
    --radius:22px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Manrope',system-ui,Segoe UI,Roboto,sans-serif;color:var(--ink);
    background:radial-gradient(1200px 600px at 50% -10%,#efe6ff,var(--bg));min-height:100vh;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  .wrap{max-width:960px;margin:0 auto;padding:20px 20px 60px}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 14px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px}
  .brand .logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--violet),var(--violet2));display:grid;place-items:center;color:#fff;font-size:16px}
  .brand small{display:block;font-weight:600;font-size:10.5px;color:var(--muted)}
  .restart{font-size:12.5px;font-weight:700;color:var(--violet2);background:#fff;border:1px solid var(--line);padding:8px 14px;border-radius:999px;cursor:pointer}
  .restart:hover{box-shadow:var(--shadow-sm)}

  .track-wrap{background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow-sm);padding:26px 26px 18px;margin-bottom:20px;position:relative;overflow:hidden}
  .track{position:relative;height:74px;margin:6px 4px 0}
  .rail{position:absolute;top:52px;left:2%;right:2%;height:12px;border-radius:12px;background:#efe9fa;overflow:hidden}
  .rail .fill{position:absolute;inset:0;width:0;border-radius:12px;background:repeating-linear-gradient(45deg,var(--gold) 0 12px,var(--gold2) 12px 24px);transition:width .6s cubic-bezier(.3,.8,.3,1)}
  .nodes{position:absolute;top:47px;left:2%;right:2%;display:flex;justify-content:space-between}
  .node{width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid #ddd3f2;transition:.4s;position:relative;z-index:2}
  .node.done{border-color:var(--gold);background:var(--gold2)}
  .node.cur{border-color:var(--violet);background:#fff;box-shadow:0 0 0 5px rgba(160,87,239,.16)}
  .node span{position:absolute;top:26px;left:50%;transform:translateX(-50%);font-size:10.5px;font-weight:700;color:var(--muted);white-space:nowrap}
  .node.cur span,.node.done span{color:var(--graphite)}
  .avatar{position:absolute;top:-14px;width:60px;transition:left .6s cubic-bezier(.3,.8,.3,1);transform:translateX(-50%);z-index:5;filter:drop-shadow(0 10px 10px rgba(90,27,168,.28))}
  .avatar img{width:100%;display:block;animation:step 1.1s ease-in-out infinite}
  @keyframes step{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-5px) rotate(2deg)}}

  .fx{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px dashed #e5ddf5}
  .fx .lbl{font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);align-self:center;margin-right:2px}
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:6px 11px;border-radius:999px;background:#f2eefb;color:#b3a9c6;opacity:.6;transition:.35s}
  .chip.on{opacity:1;background:linear-gradient(135deg,#fff,#f3ecff);color:var(--violet2);box-shadow:var(--shadow-sm);transform:translateY(-1px)}

  .stage{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:34px clamp(22px,4vw,44px);animation:pop .4s ease}
  @keyframes pop{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .kicker{font-weight:800;font-size:12.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--violet)}
  h1{font-size:clamp(24px,4vw,36px);letter-spacing:-.5px;margin:8px 0 12px;font-weight:800;line-height:1.1}
  h2{font-size:clamp(21px,3vw,28px);letter-spacing:-.4px;margin:6px 0 10px;font-weight:800}
  .lead{font-size:16.5px;color:#54565f;max-width:660px}
  .hint{font-size:13px;color:var(--muted);margin-top:10px}

  .req-list{list-style:none;margin:20px 0 8px;display:grid;gap:11px}
  .req-list li{display:flex;gap:11px;align-items:flex-start;background:#faf7ff;border:1px solid var(--line);border-radius:14px;padding:13px 15px;font-size:15px}
  .req-list .b{flex:none;width:24px;height:24px;border-radius:7px;background:#efe6ff;color:var(--violet);display:grid;place-items:center;font-size:13px;font-weight:800}

  .btn-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
  .btn{display:inline-flex;align-items:center;gap:9px;font-family:inherit;font-weight:700;font-size:15px;padding:14px 24px;border-radius:14px;cursor:pointer;border:0;transition:.2s}
  .btn.primary{background:linear-gradient(135deg,var(--violet),var(--violet2));color:#fff;box-shadow:var(--shadow)}
  .btn.primary:hover{transform:translateY(-2px)}
  .btn.ghost{background:#fff;color:var(--graphite);border:1px solid var(--line);box-shadow:var(--shadow-sm)}
  .btn.ghost:hover{transform:translateY(-2px)}
  .btn.gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#5a3d00;box-shadow:0 14px 30px -12px rgba(244,179,1,.6)}
  .btn.gold:hover{transform:translateY(-2px)}

  textarea{width:100%;margin-top:6px;border:1px solid var(--line);border-radius:14px;padding:14px;font-family:inherit;font-size:15px;min-height:76px;resize:vertical;background:#fbf9ff}
  textarea:focus{outline:2px solid var(--violet);border-color:transparent}

  .paths{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-top:22px}
  @media(max-width:720px){.paths{grid-template-columns:1fr}}
  .path{position:relative;text-align:left;background:linear-gradient(180deg,#fff,#faf7ff);border:2px solid var(--line);border-radius:18px;padding:20px 18px 18px;cursor:pointer;transition:.22s;overflow:hidden}
  .path:hover{transform:translateY(-4px);border-color:var(--gold);box-shadow:var(--shadow)}
  .path .arw{font-size:26px}
  .path .pn{font-weight:800;font-size:18px;margin:6px 0 4px}
  .path .pd{font-size:13.5px;color:#5b5d66;min-height:38px}
  .path .scope{display:inline-block;margin-top:10px;font-size:11.5px;font-weight:700;color:var(--violet2);background:#f2eefb;padding:5px 11px;border-radius:999px}
  .path .depth{margin-top:10px;height:6px;border-radius:6px;background:#eee6fb;overflow:hidden}
  .path .depth i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--violet))}

  .opts{display:grid;gap:12px;margin-top:20px}
  .opt{display:flex;align-items:center;gap:14px;text-align:left;background:#fff;border:2px solid var(--line);border-radius:16px;padding:16px 18px;cursor:pointer;transition:.2s;font-family:inherit}
  .opt:hover{transform:translateY(-2px);border-color:var(--violet);box-shadow:var(--shadow-sm)}
  .opt .em{font-size:26px;flex:none}
  .opt .ot{font-weight:800;font-size:16px}
  .opt .os{font-size:13px;color:#5b5d66}

  /* activities checklist */
  .acts{display:grid;gap:11px;margin:20px 0 6px}
  .act{display:flex;align-items:flex-start;gap:13px;background:#fff;border:2px solid var(--line);border-radius:15px;padding:14px 16px;cursor:pointer;transition:.18s}
  .act:hover{border-color:#d8c7f7}
  .act.sel{border-color:var(--violet);background:#faf6ff;box-shadow:var(--shadow-sm)}
  .act .box{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid #cdbdf0;display:grid;place-items:center;font-size:14px;color:#fff;background:#fff;transition:.18s;margin-top:1px}
  .act.sel .box{background:var(--violet);border-color:var(--violet)}
  .act .em{font-size:20px;flex:none}
  .act .txt{flex:1}
  .act .al{font-weight:700;font-size:15.5px}
  .act .note{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;margin-left:8px;vertical-align:middle}
  .note.free{background:#eef7e2;color:#5f8d18}
  .note.paid{background:#fff3e0;color:#b5730a}
  .act .links{margin-top:6px;display:flex;gap:14px;flex-wrap:wrap}
  .act .links a{font-size:12.5px;font-weight:700;color:var(--sky);text-decoration:none;border-bottom:1px dashed var(--sky)}
  .act .links a:hover{color:var(--violet2);border-color:var(--violet2)}
  .own-label{margin-top:18px;font-size:13px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:var(--violet)}

  .res-head{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .res-badge{width:70px;height:70px;border-radius:18px;background:linear-gradient(135deg,var(--gold),var(--gold2));display:grid;place-items:center;font-size:34px;flex:none;box-shadow:0 12px 26px -10px rgba(244,179,1,.6)}
  .res-name{font-size:clamp(24px,4vw,34px);font-weight:800;letter-spacing:-.5px}
  .res-tag{color:var(--muted);font-weight:700;font-size:14.5px}
  .res-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:22px}
  @media(max-width:680px){.res-grid{grid-template-columns:1fr}}
  .rc{background:#faf7ff;border:1px solid var(--line);border-radius:16px;padding:18px}
  .rc h4{font-size:13px;letter-spacing:.5px;text-transform:uppercase;color:var(--violet);margin-bottom:10px}
  .rc ul{list-style:none;display:grid;gap:8px}
  .rc li{display:flex;gap:9px;font-size:14.5px;color:#4b4d55}
  .rc li .d{color:var(--gold);font-weight:800}
  .rc li a{color:var(--sky);font-weight:700;text-decoration:none;border-bottom:1px dashed var(--sky)}
  .steps-row{display:flex;flex-wrap:wrap;gap:8px}
  .steps-row .st{font-size:12.5px;font-weight:700;background:#efe6ff;color:var(--violet2);padding:7px 12px;border-radius:999px}
  .budget{font-size:28px;font-weight:800;color:var(--graphite)}
  .budget small{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-top:4px}
  .disclaimer{margin-top:22px;background:var(--graphite);color:#fff;border-radius:16px;padding:16px 20px;font-size:14px;display:flex;gap:11px;align-items:flex-start}
  .disclaimer b{color:var(--gold2)}
  .copybox{margin-top:16px;background:#fbf9ff;border:1px dashed #d8ccf2;border-radius:14px;padding:14px;font-size:12.5px;color:#5b5d66;white-space:pre-wrap;max-height:150px;overflow:auto;display:none}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--graphite);color:#fff;padding:12px 20px;border-radius:12px;font-weight:700;font-size:14px;opacity:0;transition:.3s;z-index:99}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .footnote{text-align:center;color:var(--muted);font-size:12px;margin-top:26px}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand"><div class="logo">🧱</div><div>Клуб лидеров ССК<small>подбор формата · черновик-замысел</small></div></div>
    <button class="restart" onclick="reset()">↻ Заново</button>
  </div>

  <div class="track-wrap">
    <div class="track">
      <div class="rail"><div class="fill" id="fill"></div></div>
      <div class="nodes" id="nodes"></div>
      <div class="avatar" id="avatar" style="left:2%"><img src="assets/kubik-leader.png" alt="Кубик-РОП"/></div>
    </div>
    <div class="fx" id="fx"><span class="lbl">Эффект для Академии</span></div>
  </div>

  <div class="stage" id="stage"></div>
  <div class="footnote">Черновик-конструктор предложения · для сверки с руководителем · маскот «Кубик-РОП»</div>
</div>
<div class="toast" id="toast"></div>

<script>
var STEPS = ['welcome','request','crossroads','activities','who','result'];
var NODE_LABELS = ['Старт','Запрос','Распутье','Активности','Команда','Итог'];

var LINK_PATTERN='https://ai4g.ru/pattern-test';
var LINK_RESOURCE='https://hr-ocenka.ru/';
var EX_PATTERN='reports/pattern-report.pdf';
var EX_RESOURCE='reports/resource-k-report.pdf';

var EFFECTS = {
  fast:{i:'⚡',t:'Быстрый вау'}, cascade:{i:'⬇️',t:'Каскад менеджерам'},
  status:{i:'🏅',t:'Статус лидера'}, belong:{i:'🤝',t:'Принадлежность'},
  scout:{i:'🔍',t:'Разведка болей'}, love:{i:'💜',t:'Любовь к Академии'}
};

var BRANCH = {
  A:{icon:'⚡',name:'Искра мотивации',tag:'Быстрый вдохновляющий вход',scope:'Разовое'},
  B:{icon:'🛠',name:'Мастерская РОПа',tag:'Практика и инструменты',scope:'Трек из вебинаров'},
  C:{icon:'👑',name:'Путь лидера',tag:'Глубокое развитие + клуб',scope:'Полный трек + очное'}
};

// activities per branch
var ACT = {
  A:[
    {id:'pattern',em:'🧭',l:'Тест паттернов',note:'free',link:LINK_PATTERN,ex:EX_PATTERN},
    {id:'resource',em:'🔋',l:'Ресурс-К (диагностика ресурса)',note:'paid',link:LINK_RESOURCE,ex:EX_RESOURCE},
    {id:'ai',em:'⚡',l:'AI-инструмент «неделя → день»'},
    {id:'talk',em:'🎤',l:'Вдохновляющая сессия / спикер'},
    {id:'net',em:'🤝',l:'Знакомство-нетворкинг между городами'}
  ],
  B:[
    {id:'ai',em:'⚡',l:'AI-инструменты: отчёты, аналитика, планёрки'},
    {id:'scripts',em:'🗣',l:'Скрипты и работа с возражениями'},
    {id:'cases',em:'📂',l:'Разбор реальных кейсов'},
    {id:'pack',em:'📦',l:'Готовый пакет для менеджеров'},
    {id:'dash',em:'📊',l:'Дашборды и управление показателями'}
  ],
  C:[
    {id:'pattern',em:'🧭',l:'Тест паттернов',note:'free',link:LINK_PATTERN,ex:EX_PATTERN},
    {id:'debrief',em:'📄',l:'Дебриф по тесту — разбор результатов'},
    {id:'coach',em:'🧑‍🏫',l:'Коучинг (после дебрифа)',note:'paid'},
    {id:'resource',em:'🔋',l:'Ресурс-К (диагностика ресурса)',note:'paid',link:LINK_RESOURCE,ex:EX_RESOURCE},
    {id:'birzha',em:'🔁',l:'Биржа приёмов между городами'},
    {id:'plan',em:'🎯',l:'Личный план развития лидера'},
    {id:'club',em:'🏛',l:'Очный клуб-интенсив'},
    {id:'reg',em:'👑',l:'Клуб продолжается (регулярные встречи)'}
  ]
};

var WHO = {
  in:{t:'Своими силами',s:'Методолог + внутренний коуч',k:0.7},
  mix:{t:'Смешанно',s:'Часть внутри, часть с рынка',k:1.0},
  out:{t:'Внешние эксперты',s:'Коуч и AI-эксперт с рынка',k:1.4}
};

var S = {step:0, correction:'', branch:null, acts:[], comment:'', who:null};

function actMeta(id){ var arr=ACT[S.branch]||[]; for(var i=0;i<arr.length;i++) if(arr[i].id===id) return arr[i]; return null; }
function effectsSet(){
  var s=[]; if(S.branch) s.push('love');
  var map={ai:'fast',pack:'cascade',pattern:'scout',resource:'scout',debrief:'scout',coach:'status',plan:'status',club:'belong',reg:'belong',birzha:'belong',net:'belong'};
  (S.acts||[]).forEach(function(id){ var e=map[id]; if(e&&s.indexOf(e)<0) s.push(e); });
  if(S.branch==='C'&&s.indexOf('status')<0) s.push('status');
  return s;
}
function budgetTier(){ var n={A:1,B:2,C:3}[S.branch]||2; var w=WHO[S.who||'mix']; return '₽'.repeat(n)+(w.k>=1.4?' +':''); }

var stage=document.getElementById('stage');
function buildTrack(){
  var nodes=document.getElementById('nodes'); nodes.innerHTML='';
  NODE_LABELS.forEach(function(l,idx){ var n=document.createElement('div'); n.className='node'; n.innerHTML='<span>'+l+'</span>'; n.id='node'+idx; nodes.appendChild(n); });
  var fx=document.getElementById('fx');
  Object.keys(EFFECTS).forEach(function(k){ var c=document.createElement('span'); c.className='chip'; c.id='chip-'+k; c.innerHTML=EFFECTS[k].i+' '+EFFECTS[k].t; fx.appendChild(c); });
}
function updateTrack(){
  var pct=S.step/(STEPS.length-1);
  document.getElementById('fill').style.width=(pct*100)+'%';
  document.getElementById('avatar').style.left=(2+96*pct)+'%';
  for(var i=0;i<STEPS.length;i++){ var n=document.getElementById('node'+i); if(n) n.className='node'+(i<S.step?' done':'')+(i===S.step?' cur':''); }
  var on=effectsSet();
  Object.keys(EFFECTS).forEach(function(k){ document.getElementById('chip-'+k).className='chip'+(on.indexOf(k)>=0?' on':''); });
}
function go(step){ S.step=step; render(); }
function reset(){ S={step:0,correction:'',branch:null,acts:[],comment:'',who:null}; location.hash=''; render(); }

function render(){
  updateTrack();
  var n=STEPS[S.step];
  if(n==='welcome')return scrWelcome();
  if(n==='request')return scrRequest();
  if(n==='crossroads')return scrCrossroads();
  if(n==='activities')return scrActivities();
  if(n==='who')return scrWho();
  if(n==='result')return scrResult();
}

function scrWelcome(){
  stage.innerHTML='<div class="kicker">Конструктор предложения</div>'+
   '<h1>Соберём формат обучения<br>для ваших РОПов вместе</h1>'+
   '<p class="lead">Здравствуйте, Светлана! За пару минут вы выбираете ответы — Кубик-РОП идёт по золотой дорожке, а в конце из ваших ответов складывается готовое предложение. Ничего не решаем за вас: только показываем варианты.</p>'+
   '<p class="hint">Академия новая — это черновик-замысел. Итог сразу отправите методологу, вместе финализируем.</p>'+
   '<div class="btn-row"><button class="btn primary" onclick="go(1)">Поехали →</button></div>';
}
function scrRequest(){
  stage.innerHTML='<div class="kicker">Шаг 1 · Сверка запроса</div>'+
   '<h2>Вот как мы услышали ваш запрос</h2>'+
   '<ul class="req-list">'+
     '<li><span class="b">1</span><div>9 руководителей коммерческого отдела в разных городах. Раньше внутри компании не обучались.</div></li>'+
     '<li><span class="b">2</span><div>Цель — познакомить их с Академией и влюбить в неё. По сути маркетинговая задача: чтобы применяли сами и передавали менеджерам.</div></li>'+
     '<li><span class="b">3</span><div>Формат — на выбор: разовое, трек или очное. Можно с лидерским зеркалом (тест).</div></li>'+
     '<li><span class="b">4</span><div>Про конкретные боли пока не говорили — снимем их коротким тестом-зеркалом.</div></li>'+
   '</ul>'+
   '<div id="corrbox"></div>'+
   '<div class="btn-row"><button class="btn primary" onclick="go(2)">Всё так →</button><button class="btn ghost" onclick="showCorr()">✏️ Хочу уточнить</button></div>';
  if(S.correction) showCorr(true);
}
function showCorr(keep){
  var box=document.getElementById('corrbox');
  box.innerHTML='<textarea id="corr" placeholder="Что поправить или добавить в запрос? Ваш текст придёт методологу вместе с результатом.">'+(S.correction||'')+'</textarea>';
  var t=document.getElementById('corr'); t.oninput=function(){S.correction=t.value;}; if(!keep) t.focus();
}
function scrCrossroads(){
  function card(key,arw,depth){ var b=BRANCH[key];
    return '<button class="path" onclick="pick(\''+key+'\')"><div class="arw">'+arw+'</div><div class="pn">'+b.icon+' '+b.name+'</div><div class="pd">'+b.tag+'</div><div class="scope">'+b.scope+'</div><div class="depth"><i style="width:'+depth+'%"></i></div></button>';
  }
  stage.innerHTML='<div class="kicker">Шаг 2 · Распутье</div>'+
   '<h2>Куда направим Кубика-РОПа?</h2>'+
   '<p class="lead">Три золотые тропы — три готовых предложения, разной глубины. Выберите направление, а активности внутри соберём на следующем шаге.</p>'+
   '<div class="paths">'+card('A','⬅️',33)+card('B','⬆️',66)+card('C','➡️',100)+'</div>';
}
function pick(k){ if(S.branch!==k) S.acts=[]; S.branch=k; go(3); }

function scrActivities(){
  var arr=ACT[S.branch]||[]; var b=BRANCH[S.branch];
  var items=arr.map(function(a){
    var sel=S.acts.indexOf(a.id)>=0;
    var note=a.note==='free'?'<span class="note free">бесплатно</span>':(a.note==='paid'?'<span class="note paid">платно · тест-доступ</span>':'');
    var links='';
    if(a.link||a.ex){ links='<div class="links" onclick="event.stopPropagation()">'+
      (a.link?'<a href="'+a.link+'" target="_blank" rel="noopener">открыть ↗</a>':'')+
      (a.ex?'<a href="'+a.ex+'" target="_blank" rel="noopener">пример отчёта ↗</a>':'')+'</div>'; }
    return '<div class="act'+(sel?' sel':'')+'" data-id="'+a.id+'" onclick="toggleAct(\''+a.id+'\',this)">'+
      '<div class="box">'+(sel?'✓':'')+'</div><div class="em">'+a.em+'</div>'+
      '<div class="txt"><span class="al">'+a.l+'</span>'+note+links+'</div></div>';
  }).join('');
  stage.innerHTML='<div class="kicker">Шаг 3 · Активности · '+b.name+'</div>'+
   '<h2>Что хотелось бы включить?</h2>'+
   '<p class="lead">Отметьте всё, что нравится (можно несколько). Тесты — это «зеркало», не оценка: РОП узнаёт про себя. После теста паттернов идёт дебриф-разбор, и по желанию — коучинг.</p>'+
   '<div class="acts">'+items+'</div>'+
   '<div class="own-label">Свой вариант / комментарий</div>'+
   '<textarea id="cmt" placeholder="Добавьте свою активность или пожелание — придёт методологу.">'+(S.comment||'')+'</textarea>'+
   '<div class="btn-row"><button class="btn primary" onclick="go(4)">Далее →</button><button class="btn ghost" onclick="go(2)">← Назад</button></div>';
  var t=document.getElementById('cmt'); if(t) t.oninput=function(){S.comment=t.value;};
}
function toggleAct(id,el){
  var i=S.acts.indexOf(id);
  if(i>=0){ S.acts.splice(i,1); el.classList.remove('sel'); el.querySelector('.box').textContent=''; }
  else { S.acts.push(id); el.classList.add('sel'); el.querySelector('.box').textContent='✓'; }
  updateTrack();
}

function scrWho(){
  stage.innerHTML='<div class="kicker">Шаг 4 · Кто делает</div>'+
   '<h2>Чьими силами проводим?</h2>'+
   '<p class="lead">От этого зависит только бюджет-вилка, не сама программа.</p>'+
   '<div class="opts">'+opt('in','🏠')+opt('mix','🔀')+opt('out','🌐')+'</div>'+
   '<div class="btn-row"><button class="btn ghost" onclick="go(3)">← Назад</button></div>';
}
function opt(key,em){ var d=WHO[key];
  return '<button class="opt" onclick="chooseWho(\''+key+'\')"><span class="em">'+em+'</span><span><span class="ot">'+d.t+'</span><br><span class="os">'+d.s+'</span></span></button>';
}
function chooseWho(key){ S.who=key; go(5); }

function scrResult(){
  var b=BRANCH[S.branch]; var w=WHO[S.who||'mix'];
  var chosen=(S.acts||[]).map(function(id){ var m=actMeta(id); return m; }).filter(Boolean);
  var inside = chosen.length ? chosen.map(function(m){
    var link = m.link?' <a href="'+m.link+'" target="_blank" rel="noopener">открыть↗</a>':'';
    var ex = m.ex?' <a href="'+m.ex+'" target="_blank" rel="noopener">пример↗</a>':'';
    return '<li><span class="d">◆</span><span>'+m.l+link+ex+'</span></li>';
  }).join('') : '<li><span class="d">◆</span>Активности на ваш выбор (пока не отмечено)</li>';
  var on=effectsSet();
  var fxHtml=on.map(function(k){return '<span class="st">'+EFFECTS[k].i+' '+EFFECTS[k].t+'</span>';}).join('');
  stage.innerHTML='<div class="kicker">Готово · ваше предложение</div>'+
   '<div class="res-head"><div class="res-badge">'+b.icon+'</div><div><div class="res-name">'+b.name+'</div><div class="res-tag">'+b.tag+' · '+b.scope+'</div></div></div>'+
   '<div class="res-grid">'+
     '<div class="rc" style="grid-column:1/-1"><h4>Что включим</h4><ul>'+inside+'</ul></div>'+
     '<div class="rc"><h4>Бюджет · масштаб</h4><div class="budget">'+budgetTier()+'<small>ориентир масштаба · исполнители: '+w.t+' · точную вилку уточним</small></div></div>'+
     '<div class="rc"><h4>Эффект для Академии</h4><div class="steps-row">'+fxHtml+'</div></div>'+
   '</div>'+
   (S.comment?'<div class="rc" style="margin-top:16px"><h4>Ваш вариант / комментарий</h4><div style="font-size:14.5px;color:#4b4d55">'+escapeHtml(S.comment)+'</div></div>':'')+
   '<div class="disclaimer">📝&nbsp;<div>Это <b>черновик-замысел</b>, собранный из ваших ответов. Академия новая — программу, реальный бюджет и наполнение соберём вместе после сверки с вами.'+(S.correction?'<br><br><b>Уточнение по запросу:</b> '+escapeHtml(S.correction):'')+'</div></div>'+
   '<div class="btn-row">'+
     '<button class="btn gold" onclick="copyResult()">📋 Скопировать итог для методолога</button>'+
     '<button class="btn ghost" onclick="copyLink()">🔗 Скопировать ссылку с ответами</button>'+
     '<button class="btn ghost" onclick="reset()">↻ Пройти заново</button>'+
   '</div><div class="copybox" id="copybox"></div>';
}

function summaryText(){
  var b=BRANCH[S.branch]; var w=WHO[S.who||'mix'];
  var t='ПРЕДЛОЖЕНИЕ ДЛЯ РОПов — черновик из квеста\n';
  t+='Ветка: '+b.name+' ('+b.scope+')\n';
  var names=(S.acts||[]).map(function(id){var m=actMeta(id);return m?m.l:id;});
  t+='Активности: '+(names.length?names.join('; '):'—')+'\n';
  t+='Исполнители: '+w.t+'\n';
  t+='Бюджет (масштаб): '+budgetTier()+'\n';
  if(S.comment) t+='Свой вариант/комментарий: '+S.comment+'\n';
  if(S.correction) t+='Уточнение по запросу: '+S.correction+'\n';
  t+='Ссылка с ответами: '+shareUrl();
  return t;
}
function shareUrl(){
  var data={b:S.branch,a:S.acts,m:S.comment,w:S.who,c:S.correction};
  return location.origin+location.pathname+'#'+encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(data)))));
}
function copyResult(){ var box=document.getElementById('copybox'); box.style.display='block'; box.textContent=summaryText(); copy(summaryText(),'Итог скопирован — вставьте методологу'); }
function copyLink(){ copy(shareUrl(),'Ссылка скопирована'); }
function copy(text,msg){ if(navigator.clipboard){ navigator.clipboard.writeText(text).then(function(){toast(msg);},function(){fallbackCopy(text,msg);}); } else fallbackCopy(text,msg); }
function fallbackCopy(text,msg){ var ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');toast(msg);}catch(e){toast('Скопируйте вручную ниже');} document.body.removeChild(ta); }
function toast(m){ var t=document.getElementById('toast'); t.textContent=m; t.className='toast show'; setTimeout(function(){t.className='toast';},2200); }
function escapeHtml(s){ return s.replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];}); }

function initFromHash(){
  if(location.hash.length>1){ try{
    var d=JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(location.hash.slice(1))))));
    if(d.b){ S.branch=d.b; S.acts=d.a||[]; S.comment=d.m||''; S.who=d.w||null; S.correction=d.c||''; S.step=5; return true; }
  }catch(e){} }
  return false;
}

buildTrack();
if(!initFromHash()) S.step=0;
render();
</script>
</body>
</html>
