<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Клуб лидеров ССК — подбор формата для РОПов</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{
    --violet:#a057ef; --violet2:#7b2fd6; --deep:#5a1ba8;
    --graphite:#373a41; --ink:#2a2b30; --muted:#7c7f8a;
    --gold:#f4b301; --gold2:#ffd75e; --lime:#9bc43c; --sky:#27a4e4;
    --bg:#f6f3fc; --card:#fff; --line:#ece8f5;
    --shadow:0 20px 55px -22px rgba(90,27,168,.4);
    --shadow-sm:0 8px 24px -12px rgba(90,27,168,.3);
    --radius:22px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Manrope',system-ui,Segoe UI,Roboto,sans-serif;color:var(--ink);
    background:radial-gradient(1200px 600px at 50% -10%,#efe6ff,var(--bg));
    min-height:100vh;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden
  }
  .wrap{max-width:940px;margin:0 auto;padding:20px 20px 60px}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 14px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px}
  .brand .logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--violet),var(--violet2));display:grid;place-items:center;color:#fff;font-size:16px}
  .brand small{display:block;font-weight:600;font-size:10.5px;color:var(--muted)}
  .restart{font-size:12.5px;font-weight:700;color:var(--violet2);background:#fff;border:1px solid var(--line);padding:8px 14px;border-radius:999px;cursor:pointer}
  .restart:hover{box-shadow:var(--shadow-sm)}

  /* ===== TRACK ===== */
  .track-wrap{background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow-sm);padding:26px 26px 18px;margin-bottom:20px;position:relative;overflow:hidden}
  .track{position:relative;height:74px;margin:6px 4px 0}
  .rail{position:absolute;top:52px;left:2%;right:2%;height:12px;border-radius:12px;background:#efe9fa;overflow:hidden}
  .rail .fill{position:absolute;inset:0;width:0;border-radius:12px;background:
    repeating-linear-gradient(45deg,var(--gold) 0 12px,var(--gold2) 12px 24px);
    transition:width .6s cubic-bezier(.3,.8,.3,1);box-shadow:0 2px 10px rgba(244,179,1,.5) inset}
  .nodes{position:absolute;top:47px;left:2%;right:2%;display:flex;justify-content:space-between}
  .node{width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid #ddd3f2;transition:.4s;position:relative;z-index:2}
  .node.done{border-color:var(--gold);background:var(--gold2)}
  .node.cur{border-color:var(--violet);background:#fff;box-shadow:0 0 0 5px rgba(160,87,239,.16)}
  .node span{position:absolute;top:26px;left:50%;transform:translateX(-50%);font-size:10.5px;font-weight:700;color:var(--muted);white-space:nowrap}
  .node.cur span,.node.done span{color:var(--graphite)}
  .avatar{position:absolute;top:-14px;width:60px;transition:left .6s cubic-bezier(.3,.8,.3,1);transform:translateX(-50%);z-index:5;filter:drop-shadow(0 10px 10px rgba(90,27,168,.28))}
  .avatar img{width:100%;display:block;animation:step 1.1s ease-in-out infinite}
  @keyframes step{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-5px) rotate(2deg)}}

  /* effects strip */
  .fx{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px dashed #e5ddf5}
  .fx .lbl{font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);align-self:center;margin-right:2px}
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:6px 11px;border-radius:999px;background:#f2eefb;color:#b3a9c6;opacity:.6;transition:.35s}
  .chip.on{opacity:1;background:linear-gradient(135deg,#fff,#f3ecff);color:var(--violet2);box-shadow:var(--shadow-sm);transform:translateY(-1px)}
  .chip.on .i{filter:none}
  .chip .i{filter:grayscale(1)}

  /* ===== STAGE ===== */
  .stage{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:34px clamp(22px,4vw,44px);animation:pop .4s ease}
  @keyframes pop{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .kicker{font-weight:800;font-size:12.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--violet)}
  h1{font-size:clamp(24px,4vw,36px);letter-spacing:-.5px;margin:8px 0 12px;font-weight:800;line-height:1.1}
  h2{font-size:clamp(21px,3vw,28px);letter-spacing:-.4px;margin:6px 0 10px;font-weight:800}
  .lead{font-size:16.5px;color:#54565f;max-width:640px}
  .hint{font-size:13px;color:var(--muted);margin-top:10px}

  .req-list{list-style:none;margin:20px 0 8px;display:grid;gap:11px}
  .req-list li{display:flex;gap:11px;align-items:flex-start;background:#faf7ff;border:1px solid var(--line);border-radius:14px;padding:13px 15px;font-size:15px}
  .req-list .b{flex:none;width:24px;height:24px;border-radius:7px;background:#efe6ff;color:var(--violet);display:grid;place-items:center;font-size:13px;font-weight:800}

  .btn-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
  .btn{display:inline-flex;align-items:center;gap:9px;font-family:inherit;font-weight:700;font-size:15px;padding:14px 24px;border-radius:14px;cursor:pointer;border:0;transition:.2s}
  .btn.primary{background:linear-gradient(135deg,var(--violet),var(--violet2));color:#fff;box-shadow:var(--shadow)}
  .btn.primary:hover{transform:translateY(-2px)}
  .btn.ghost{background:#fff;color:var(--graphite);border:1px solid var(--line);box-shadow:var(--shadow-sm)}
  .btn.ghost:hover{transform:translateY(-2px)}
  .btn.gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#5a3d00;box-shadow:0 14px 30px -12px rgba(244,179,1,.6)}
  .btn.gold:hover{transform:translateY(-2px)}

  textarea{width:100%;margin-top:16px;border:1px solid var(--line);border-radius:14px;padding:14px;font-family:inherit;font-size:15px;min-height:90px;resize:vertical;background:#fbf9ff}
  textarea:focus{outline:2px solid var(--violet);border-color:transparent}

  /* crossroads */
  .paths{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-top:22px}
  @media(max-width:720px){.paths{grid-template-columns:1fr}}
  .path{position:relative;text-align:left;background:linear-gradient(180deg,#fff,#faf7ff);border:2px solid var(--line);border-radius:18px;padding:20px 18px 18px;cursor:pointer;transition:.22s;overflow:hidden}
  .path:hover{transform:translateY(-4px);border-color:var(--gold);box-shadow:var(--shadow)}
  .path .arw{font-size:26px}
  .path .pn{font-weight:800;font-size:18px;margin:6px 0 4px}
  .path .pd{font-size:13.5px;color:#5b5d66;min-height:38px}
  .path .scope{display:inline-block;margin-top:10px;font-size:11.5px;font-weight:700;color:var(--violet2);background:#f2eefb;padding:5px 11px;border-radius:999px}
  .path .depth{margin-top:10px;height:6px;border-radius:6px;background:#eee6fb;overflow:hidden}
  .path .depth i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--violet))}

  /* option pills */
  .opts{display:grid;gap:12px;margin-top:20px}
  .opt{display:flex;align-items:center;gap:14px;text-align:left;background:#fff;border:2px solid var(--line);border-radius:16px;padding:16px 18px;cursor:pointer;transition:.2s;font-family:inherit}
  .opt:hover{transform:translateY(-2px);border-color:var(--violet);box-shadow:var(--shadow-sm)}
  .opt .em{font-size:26px;flex:none}
  .opt .ot{font-weight:800;font-size:16px}
  .opt .os{font-size:13px;color:#5b5d66}

  /* result */
  .res-head{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .res-badge{width:70px;height:70px;border-radius:18px;background:linear-gradient(135deg,var(--gold),var(--gold2));display:grid;place-items:center;font-size:34px;flex:none;box-shadow:0 12px 26px -10px rgba(244,179,1,.6)}
  .res-name{font-size:clamp(24px,4vw,34px);font-weight:800;letter-spacing:-.5px}
  .res-tag{color:var(--muted);font-weight:700;font-size:14.5px}
  .res-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:22px}
  @media(max-width:680px){.res-grid{grid-template-columns:1fr}}
  .rc{background:#faf7ff;border:1px solid var(--line);border-radius:16px;padding:18px}
  .rc h4{font-size:13px;letter-spacing:.5px;text-transform:uppercase;color:var(--violet);margin-bottom:10px}
  .rc ul{list-style:none;display:grid;gap:8px}
  .rc li{display:flex;gap:9px;font-size:14.5px;color:#4b4d55}
  .rc li .d{color:var(--gold);font-weight:800}
  .steps-row{display:flex;flex-wrap:wrap;gap:8px}
  .steps-row .st{font-size:12.5px;font-weight:700;background:#efe6ff;color:var(--violet2);padding:7px 12px;border-radius:999px}
  .budget{font-size:28px;font-weight:800;color:var(--graphite)}
  .budget small{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-top:4px}
  .disclaimer{margin-top:22px;background:var(--graphite);color:#fff;border-radius:16px;padding:16px 20px;font-size:14px;display:flex;gap:11px;align-items:flex-start}
  .disclaimer b{color:var(--gold2)}
  .copybox{margin-top:16px;background:#fbf9ff;border:1px dashed #d8ccf2;border-radius:14px;padding:14px;font-size:12.5px;color:#5b5d66;white-space:pre-wrap;max-height:150px;overflow:auto;display:none}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--graphite);color:#fff;padding:12px 20px;border-radius:12px;font-weight:700;font-size:14px;opacity:0;transition:.3s;z-index:99}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .footnote{text-align:center;color:var(--muted);font-size:12px;margin-top:26px}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand"><div class="logo">🧱</div><div>Клуб лидеров ССК<small>подбор формата · черновик</small></div></div>
    <button class="restart" onclick="reset()">↻ Заново</button>
  </div>

  <!-- TRACK -->
  <div class="track-wrap">
    <div class="track">
      <div class="rail"><div class="fill" id="fill"></div></div>
      <div class="nodes" id="nodes"></div>
      <div class="avatar" id="avatar" style="left:2%"><img src="assets/kubik-leader.png" alt="Кубик-РОП"/></div>
    </div>
    <div class="fx" id="fx">
      <span class="lbl">Эффект для Академии</span>
    </div>
  </div>

  <!-- STAGE -->
  <div class="stage" id="stage"></div>

  <div class="footnote">Черновик-конструктор предложения · для сверки с руководителем · маскот «Кубик-РОП»</div>
</div>
<div class="toast" id="toast"></div>

<script>
// ---------- data ----------
var STEPS = ['welcome','request','crossroads','diagnostic','who','result'];
var NODE_LABELS = ['Старт','Запрос','Распутье','Зеркало','Команда','Итог'];

var EFFECTS = {
  fast:{i:'⚡',t:'Быстрый вау'},
  cascade:{i:'⬇️',t:'Каскад менеджерам'},
  status:{i:'🏅',t:'Статус лидера'},
  belong:{i:'🤝',t:'Принадлежность'},
  scout:{i:'🔍',t:'Разведка болей'},
  love:{i:'💜',t:'Любовь к Академии'}
};

var BRANCH = {
  A:{icon:'⚡',name:'Искра мотивации',tag:'Быстрый вдохновляющий вход',scope:'Разовое',
     stages:['Диагностика-зеркало (по желанию)','Клубная встреча онлайн, 90 мин'],
     inside:['Мини-зеркало «какой я лидер»','Живой разбор одной ситуации','AI-вишенка «неделя → день»','Знакомство с Академией и заряд'],
     fx:['fast','love'], base:[80,180]},
  B:{icon:'🛠',name:'Мастерская РОПа',tag:'Практика и инструменты',scope:'Трек из вебинаров',
     stages:['Диагностика','2-3 практикума онлайн','Пакет для менеджеров'],
     inside:['AI-рычаг: отчёты, аналитика, планёрки','Разборы и рабочие скрипты','Готовый мини-курс — спустить менеджерам'],
     fx:['fast','cascade','love'], base:[220,420]},
  C:{icon:'👑',name:'Путь лидера',tag:'Глубокое развитие + клуб',scope:'Полный трек + очное',
     stages:['Глубокая диагностика','Серия онлайн-встреч','Очный клуб-интенсив, 1 день','Клуб продолжается'],
     inside:['Коучинг паттернов и ресурса','Биржа приёмов между городами','Личный план лидера','Статус «Клуб лидеров ССК»'],
     fx:['status','belong','cascade','love'], base:[500,900]}
};

var DIAG = {
  pattern:{t:'Тест паттернов',s:'Бесплатно · персональный отчёт по стилю лидера',fx:'scout',add:0},
  resource:{t:'Ресурс-профиль',s:'Бесплатно · срез энергии и выгорания',fx:'scout',add:0},
  none:{t:'Без зеркала',s:'Сразу к встрече',fx:null,add:0}
};
var WHO = {
  in:{t:'Своими силами',s:'Методолог + внутренний коуч',k:0.7},
  mix:{t:'Смешанно',s:'Часть внутри, часть с рынка',k:1.0},
  out:{t:'Внешние эксперты',s:'Коуч и AI-эксперт с рынка',k:1.4}
};

// ---------- state ----------
var S = {step:0, correction:'', branch:null, diagnostic:null, who:null};

function effectsSet(){
  var set = [];
  if(S.branch){ BRANCH[S.branch].fx.forEach(function(f){ if(set.indexOf(f)<0) set.push(f); }); }
  if(S.diagnostic && DIAG[S.diagnostic].fx){ if(set.indexOf('scout')<0) set.push('scout'); }
  return set;
}

// ---------- render helpers ----------
var stage = document.getElementById('stage');

function buildTrack(){
  var nodes = document.getElementById('nodes'); nodes.innerHTML='';
  NODE_LABELS.forEach(function(l,idx){
    var n=document.createElement('div'); n.className='node';
    n.innerHTML='<span>'+l+'</span>'; n.id='node'+idx; nodes.appendChild(n);
  });
  // effects chips
  var fx=document.getElementById('fx');
  Object.keys(EFFECTS).forEach(function(k){
    var c=document.createElement('span'); c.className='chip'; c.id='chip-'+k;
    c.innerHTML='<span class="i">'+EFFECTS[k].i+'</span>'+EFFECTS[k].t; fx.appendChild(c);
  });
}
function updateTrack(){
  var pct = S.step/(STEPS.length-1);
  document.getElementById('fill').style.width = (pct*100)+'%';
  var railLeft=2, railRight=98;
  document.getElementById('avatar').style.left = (railLeft + (railRight-railLeft)*pct) + '%';
  for(var i=0;i<STEPS.length;i++){
    var n=document.getElementById('node'+i); if(!n) continue;
    n.className='node'+(i<S.step?' done':'')+(i===S.step?' cur':'');
  }
  var on=effectsSet();
  Object.keys(EFFECTS).forEach(function(k){
    document.getElementById('chip-'+k).className='chip'+(on.indexOf(k)>=0?' on':'');
  });
}
function go(step){ S.step=step; render(); }
function reset(){ S={step:0,correction:'',branch:null,diagnostic:null,who:null}; location.hash=''; render(); }

function budgetTier(){
  var n={A:1,B:2,C:3}[S.branch]||2;
  var w=WHO[S.who||'mix'];
  var extra = w.k>=1.4?' +' : '';
  return '₽'.repeat(n)+extra;
}

// ---------- screens ----------
function render(){
  updateTrack();
  var name=STEPS[S.step];
  if(name==='welcome') return scrWelcome();
  if(name==='request') return scrRequest();
  if(name==='crossroads') return scrCrossroads();
  if(name==='diagnostic') return scrDiagnostic();
  if(name==='who') return scrWho();
  if(name==='result') return scrResult();
}

function scrWelcome(){
  stage.innerHTML =
   '<div class="kicker">Конструктор предложения</div>'+
   '<h1>Соберём формат обучения<br>для ваших РОПов вместе</h1>'+
   '<p class="lead">Здравствуйте, Светлана! За пару минут вы выбираете ответы — Кубик-РОП идёт по золотой дорожке, а в конце из ваших ответов складывается готовое предложение. Ничего не решаем за вас: только показываем варианты.</p>'+
   '<p class="hint">Итог можно сразу отправить методологу — вместе финализируем.</p>'+
   '<div class="btn-row"><button class="btn primary" onclick="go(1)">Поехали →</button></div>';
}

function scrRequest(){
  stage.innerHTML =
   '<div class="kicker">Шаг 1 · Сверка запроса</div>'+
   '<h2>Вот как мы услышали ваш запрос</h2>'+
   '<ul class="req-list">'+
     '<li><span class="b">1</span><div>9 руководителей коммерческого отдела в разных городах. Раньше внутри компании не обучались.</div></li>'+
     '<li><span class="b">2</span><div>Цель — познакомить их с Академией и влюбить в неё. По сути маркетинговая задача: чтобы применяли сами и передавали менеджерам.</div></li>'+
     '<li><span class="b">3</span><div>Формат — на выбор: разовое, трек или очное. Можно с лёгкой входной диагностикой.</div></li>'+
     '<li><span class="b">4</span><div>Про конкретные боли пока не говорили — предлагаем снять их короткой диагностикой.</div></li>'+
   '</ul>'+
   '<div id="corrbox"></div>'+
   '<div class="btn-row">'+
     '<button class="btn primary" onclick="go(2)">Всё так →</button>'+
     '<button class="btn ghost" onclick="showCorr()">✏️ Хочу уточнить</button>'+
   '</div>';
  if(S.correction) showCorr(true);
}
function showCorr(keep){
  var box=document.getElementById('corrbox');
  box.innerHTML='<textarea id="corr" placeholder="Что поправить или добавить в запрос? Ваш текст придёт методологу вместе с результатом.">'+(S.correction||'')+'</textarea>';
  var t=document.getElementById('corr');
  t.oninput=function(){ S.correction=t.value; };
  if(!keep) t.focus();
}

function scrCrossroads(){
  var p=BRANCH;
  function card(key,arw,depth){
    var b=p[key];
    return '<button class="path" onclick="pick(\''+key+'\')">'+
      '<div class="arw">'+arw+'</div>'+
      '<div class="pn">'+b.icon+' '+b.name+'</div>'+
      '<div class="pd">'+b.tag+'</div>'+
      '<div class="scope">'+b.scope+'</div>'+
      '<div class="depth"><i style="width:'+depth+'%"></i></div>'+
    '</button>';
  }
  stage.innerHTML =
   '<div class="kicker">Шаг 2 · Распутье</div>'+
   '<h2>Куда направим Кубика-лидера?</h2>'+
   '<p class="lead">Три золотые тропы — три готовых предложения. Отличаются глубиной. Выберите направление, детали докрутим дальше.</p>'+
   '<div class="paths">'+ card('A','⬅️',33)+card('B','⬆️',66)+card('C','➡️',100) +'</div>';
}
function pick(k){ S.branch=k; go(3); }

function scrDiagnostic(){
  stage.innerHTML =
   '<div class="kicker">Шаг 3 · Лидерское зеркало</div>'+
   '<h2>Добавим лидерское зеркало?</h2>'+
   '<p class="lead">Не оценка, а подарок-инсайт: РОП за 5 минут узнаёт про себя. Вовлекает и заодно легально показывает нам их боли — без интервью и NDA. Оба инструмента бесплатные.</p>'+
   '<div class="opts">'+
     opt('diagnostic','pattern','🧭')+opt('diagnostic','resource','🔋')+opt('diagnostic','none','⏭')+
   '</div>';
}
function scrWho(){
  stage.innerHTML =
   '<div class="kicker">Шаг 4 · Кто делает</div>'+
   '<h2>Чьими силами проводим?</h2>'+
   '<p class="lead">От этого зависит только бюджет-вилка, не сама программа.</p>'+
   '<div class="opts">'+
     opt('who','in','🏠')+opt('who','mix','🔀')+opt('who','out','🌐')+
   '</div>';
}
function opt(group,key,em){
  var d = group==='diagnostic'?DIAG[key]:WHO[key];
  return '<button class="opt" onclick="choose(\''+group+'\',\''+key+'\')">'+
    '<span class="em">'+em+'</span><span><span class="ot">'+d.t+'</span><br><span class="os">'+d.s+'</span></span></button>';
}
function choose(group,key){
  S[group]=key;
  if(group==='diagnostic') go(4);
  else { pushHash(); go(5); }
}

function scrResult(){
  var b=BRANCH[S.branch]; var d=DIAG[S.diagnostic||'none']; var w=WHO[S.who||'mix'];
  var stages = b.stages.slice();
  if(S.diagnostic==='none') stages = stages.filter(function(s){return s.toLowerCase().indexOf('диагностик')<0;});
  var on=effectsSet();
  var fxHtml = on.map(function(k){return '<span class="st">'+EFFECTS[k].i+' '+EFFECTS[k].t+'</span>';}).join('');
  stage.innerHTML =
   '<div class="kicker">Готово · ваше предложение</div>'+
   '<div class="res-head">'+
     '<div class="res-badge">'+b.icon+'</div>'+
     '<div><div class="res-name">'+b.name+'</div><div class="res-tag">'+b.tag+' · '+b.scope+'</div></div>'+
   '</div>'+
   '<div class="res-grid">'+
     '<div class="rc"><h4>Этапы</h4><div class="steps-row">'+stages.map(function(s){return '<span class="st">'+s+'</span>';}).join('')+'</div></div>'+
     '<div class="rc"><h4>Что внутри</h4><ul>'+b.inside.map(function(s){return '<li><span class="d">◆</span>'+s+'</li>';}).join('')+'</ul></div>'+
     '<div class="rc"><h4>Лидерское зеркало</h4><ul><li><span class="d">◆</span>'+d.t+' — '+d.s+'</li></ul></div>'+
     '<div class="rc"><h4>Бюджет · масштаб</h4><div class="budget">'+budgetTier()+'<small>ориентир масштаба · исполнители: '+w.t+' · точную вилку уточним после сверки</small></div></div>'+
   '</div>'+
   '<div class="rc" style="margin-top:16px"><h4>Маркетинговый эффект для Академии</h4><div class="steps-row">'+fxHtml+'</div></div>'+
   '<div class="disclaimer">📝&nbsp;<div>Это <b>черновик-замысел</b>, собранный из ваших ответов. Академия новая — программу, реальный бюджет и наполнение соберём вместе после сверки с вами.'+(S.correction?'<br><br><b>Ваше уточнение:</b> '+escapeHtml(S.correction):'')+'</div></div>'+
   '<div class="btn-row">'+
     '<button class="btn gold" onclick="copyResult()">📋 Скопировать итог для методолога</button>'+
     '<button class="btn ghost" onclick="copyLink()">🔗 Скопировать ссылку с ответами</button>'+
     '<button class="btn ghost" onclick="reset()">↻ Пройти заново</button>'+
   '</div>'+
   '<div class="copybox" id="copybox"></div>';
}

// ---------- summary / share ----------
function summaryText(){
  var b=BRANCH[S.branch]; var d=DIAG[S.diagnostic||'none']; var w=WHO[S.who||'mix'];
  var t='ПРЕДЛОЖЕНИЕ ДЛЯ РОПов — черновик из квеста\n';
  t+='Ветка: '+b.name+' ('+b.scope+')\n';
  t+='Диагностика: '+d.t+'\n';
  t+='Исполнители: '+w.t+'\n';
  t+='Бюджет (масштаб): '+budgetTier()+' · исполнители '+w.t+' (точную вилку уточним)\n';
  if(S.correction) t+='Уточнение Светланы: '+S.correction+'\n';
  t+='Ссылка с ответами: '+shareUrl();
  return t;
}
function pushHash(){ /* reserved */ }
function shareUrl(){
  var data={b:S.branch,d:S.diagnostic,w:S.who,c:S.correction};
  return location.origin+location.pathname+'#'+encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(data)))));
}
function copyResult(){
  var box=document.getElementById('copybox'); box.style.display='block'; box.textContent=summaryText();
  copy(summaryText(),'Итог скопирован — вставьте методологу');
}
function copyLink(){ copy(shareUrl(),'Ссылка скопирована'); }
function copy(text,msg){
  if(navigator.clipboard){ navigator.clipboard.writeText(text).then(function(){toast(msg);},function(){fallbackCopy(text,msg);}); }
  else fallbackCopy(text,msg);
}
function fallbackCopy(text,msg){
  var ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select();
  try{document.execCommand('copy');toast(msg);}catch(e){toast('Скопируйте вручную из окна ниже');}
  document.body.removeChild(ta);
}
function toast(m){ var t=document.getElementById('toast'); t.textContent=m; t.className='toast show'; setTimeout(function(){t.className='toast';},2200); }
function escapeHtml(s){ return s.replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];}); }

// ---------- init (restore from hash) ----------
function initFromHash(){
  if(location.hash.length>1){
    try{
      var data=JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(location.hash.slice(1))))));
      if(data.b){ S.branch=data.b; S.diagnostic=data.d||null; S.who=data.w||null; S.correction=data.c||''; S.step=5; return true; }
    }catch(e){}
  }
  return false;
}

buildTrack();
if(!initFromHash()) S.step=0;
render();
</script>
</body>
</html>
